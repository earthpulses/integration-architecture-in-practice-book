<svg viewBox="0 0 940 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Integration lifecycle" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><rect width="940" height="200" fill="#ffffff"/><polygon points="14,30 126,30 142,70 126,110 14,110 28,70" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="76" y="76" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Discover</text><text x="76" y="132" fill="#4b5563" font-size="12" text-anchor="middle">brief, authority</text><text x="76" y="148" fill="#4b5563" font-size="12" text-anchor="middle">matrix, numbers</text><polygon points="146,30 258,30 274,70 258,110 146,110 160,70" fill="#e4ebf7" stroke="#111827" stroke-width="1.5"/><text x="208" y="76" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Design</text><text x="208" y="132" fill="#4b5563" font-size="12" text-anchor="middle">pattern, ADRs,</text><text x="208" y="148" fill="#4b5563" font-size="12" text-anchor="middle">contracts</text><polygon points="278,30 390,30 406,70 390,110 278,110 292,70" fill="#e4ebf7" stroke="#111827" stroke-width="1.5"/><text x="340" y="76" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Build</text><text x="340" y="132" fill="#4b5563" font-size="12" text-anchor="middle">flows, mappings,</text><text x="340" y="148" fill="#4b5563" font-size="12" text-anchor="middle">IaC</text><polygon points="410,30 522,30 538,70 522,110 410,110 424,70" fill="#e4ebf7" stroke="#111827" stroke-width="1.5"/><text x="472" y="76" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Test</text><text x="472" y="132" fill="#4b5563" font-size="12" text-anchor="middle">contract, failure,</text><text x="472" y="148" fill="#4b5563" font-size="12" text-anchor="middle">volume tests</text><polygon points="542,30 654,30 670,70 654,110 542,110 556,70" fill="#e4ebf7" stroke="#111827" stroke-width="1.5"/><text x="604" y="76" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Release</text><text x="604" y="132" fill="#4b5563" font-size="12" text-anchor="middle">go-live checklist,</text><text x="604" y="148" fill="#4b5563" font-size="12" text-anchor="middle">backfill</text><polygon points="674,30 786,30 802,70 786,110 674,110 688,70" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="736" y="76" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Operate</text><text x="736" y="132" fill="#4b5563" font-size="12" text-anchor="middle">alerts, runbook,</text><text x="736" y="148" fill="#4b5563" font-size="12" text-anchor="middle">reconcile</text><polygon points="806,30 918,30 934,70 918,110 806,110 820,70" fill="#e4ebf7" stroke="#111827" stroke-width="1.5"/><text x="868" y="76" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Evolve</text><text x="868" y="132" fill="#4b5563" font-size="12" text-anchor="middle">version, deprecate,</text><text x="868" y="148" fill="#4b5563" font-size="12" text-anchor="middle">retire</text><text x="470" y="186" fill="#4b5563" font-size="12.5" text-anchor="middle" font-style="italic">Yellow phases are where integrations most often fail: unclear discovery on the left, missing operations on the right.</text></svg>