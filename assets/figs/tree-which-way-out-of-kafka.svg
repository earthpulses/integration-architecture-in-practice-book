106.0,273.0 29.0,235.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="106.0" y="231.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Where does the</text><text x="106.0" y="247.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">data leave to?</text><rect x="294.8" y="69.0" width="270.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="91.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Store or warehouse:</text><text x="429.8" y="107.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">sink connector</text><rect x="261.3" y="132.0" width="337.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="154.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">REST API with limits: consumer or</text><text x="429.8" y="170.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">HTTP sink; pause on 429, idempotency keys</text><rect x="291.8" y="195.0" width="276.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="217.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Serverless: event-source trigger,</text><text x="429.8" y="233.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">idempotent handler</text><rect x="294.8" y="258.0" width="270.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="280.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Browsers or mobile:</text><text x="429.8" y="296.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">SSE / WebSocket gateway</text><rect x="294.8" y="321.0" width="270.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="343.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">SaaS via flows: iPaaS listener</text><text x="429.8" y="359.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">(check acknowledgement mode)</text><rect x="291.8" y="384.0" width="276.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="429.8" y="406.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Task semantics, order not needed:</text><text x="429.8" y="422.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">share groups (4.2+) or a queue</text><rect x="206.2" y="157.5" width="54.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="233.3" y="169.0" fill="#111827" font-size="12" text-anchor="middle">DB / S3</text><rect x="204.4" y="189.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="218.3" y="200.5" fill="#111827" font-size="12" text-anchor="middle">API</text><rect x="244.7" y="213.5" width="34.4" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="261.9" y="225.0" fill="#111827" font-size="12" text-anchor="middle">FaaS</text><rect x="222.7" y="252.0" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="233.3" y="263.5" fill="#111827" font-size="12" text-anchor="middle">UI</text><rect x="216.1" y="283.5" width="34.4" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="233.3" y="295.0" fill="#111827" font-size="12" text-anchor="middle">SaaS</text><rect x="211.5" y="315.0" width="41.0" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="232.0" y="326.5" fill="#111827" font-size="12" text-anchor="middle">tasks</text></svg>