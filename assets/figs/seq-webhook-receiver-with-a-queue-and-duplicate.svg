.6" marker-end="url(#SQ3mG)"/><text x="524.0" y="655" fill="#111827" font-size="12.5" text-anchor="middle">yes: skip</text><circle cx="569.0" cy="662" r="8.5" fill="#111827"/><text x="569.0" y="666.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">13</text><rect x="147.0" y="676" width="502.0" height="44" rx="7" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="398.0" y="693" fill="#111827" font-size="12.5" text-anchor="middle">Senders retry and have no replay when you were down: add a periodic reconcile</text><text x="398.0" y="709" fill="#111827" font-size="12.5" text-anchor="middle">pull.</text></svg>