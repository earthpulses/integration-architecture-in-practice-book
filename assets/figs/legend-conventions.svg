<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-label="Diagram conventions"><defs><marker id="mink" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="mblue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="mgray" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="mgreen" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker></defs><rect width="640" height="262" fill="#ffffff"/><text x="12" y="20" font-size="13" font-weight="700" fill="#111827">Arrows</text><line x1="14" y1="44" x2="104" y2="44" stroke="#111827" stroke-width="2.4" marker-end="url(#mink)"/><text x="118" y="48" font-size="12.5" fill="#111827">Synchronous call (the caller waits)</text><line x1="14" y1="78" x2="104" y2="78" stroke="#111827" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#mink)"/><text x="118" y="82" font-size="12.5" fill="#111827">Asynchronous message (the sender does not wait)</text><line x1="14" y1="112" x2="104" y2="112" stroke="#2f6db5" stroke-width="2.4" marker-end="url(#mblue)"/><text x="118" y="116" font-size="12.5" fill="#111827">Pull (the reader initiates)</text><line x1="14" y1="146" x2="104" y2="146" stroke="#2f6db5" stroke-width="4.2" stroke-dasharray="2 5" marker-end="url(#mblue)"/><text x="118" y="150" font-size="12.5" fill="#111827">Bulk data movement</text><line x1="14" y1="180" x2="104" y2="180" stroke="#2d8a5f" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#mgreen)"/><text x="118" y="184" font-size="12.5" fill="#111827">Event</text><line x1="14" y1="214" x2="104" y2="214" stroke="#6b7280" stroke-width="1.6" marker-end="url(#mgray)"/><text x="118" y="218" font-size="12.5" fill="#111827">Response</text><text x="372" y="20" font-size="13" font-weight="700" fill="#111827">Markers and shapes</text><circle cx="384" cy="42" r="10" fill="#111827"/><text x="384" y="46.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="402" y="46" font-size="12.5" fill="#111827">Order of the steps</text><circle cx="384" cy="74" r="10" fill="#c0392b"/><text x="384" y="78.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="402" y="78" font-size="12.5" fill="#111827">Where it usually fails (explained below)</text><rect x="372" y="100" width="124" height="34" rx="8" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="434" y="121" font-size="11.5" text-anchor="middle" fill="#111827">Application or system</text><rect x="506" y="100" width="124" height="34" rx="8" fill="#f0f4fb" stroke="#111827" stroke-width="2.2"/><text x="568" y="121" font-size="11.5" text-anchor="middle" fill="#111827">Key component</text><rect x="372" y="150" width="124" height="34" rx="8" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="434" y="171" font-size="11.5" text-anchor="middle" fill="#111827">Queue, topic, or broker</text><line x1="396" y1="154" x2="396" y2="180" stroke="#bfae6e"/><line x1="472" y1="154" x2="472" y2="180" stroke="#bfae6e"/><rect x="506" y="150" width="124" height="34" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="568" y="171" font-size="11.5" text-anchor="middle" fill="#111827">External party</text><rect x="372" y="200" width="124" height="34" rx="8" fill="#fbe2df" stroke="#c0392b" stroke-width="1.8"/><text x="434" y="221" font-size="11.5" text-anchor="middle" fill="#111827">Failure or dead end</text><ellipse cx="568" cy="206" rx="54" ry="7" fill="#f0f4fb" stroke="#2f6db5" stroke-width="1.8"/><path d="M514,206 v26 a54,7 0 0 0 108,0 v-26" fill="#f0f4fb" stroke="#2f6db5" stroke-width="1.8"/><text x="568" y="226" font-size="11.5" text-anchor="middle" fill="#111827">Database or store</text><rect x="12" y="214" width="340" height="40" rx="6" fill="#f6f6f6" stroke="#bbb"/><text x="22" y="232" font-size="11.5" fill="#333">Solid lines wait for an answer; dashed lines do not.</text><text x="22" y="248" font-size="11.5" fill="#333">Diagrams read left to right and top to bottom.</text></svg>