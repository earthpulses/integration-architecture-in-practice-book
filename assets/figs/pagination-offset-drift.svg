<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif" role="img"><rect width="640" height="290" fill="#fff"/><defs><marker id="mink" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="mblue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="mgray" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="mgreen" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker><marker id="mred" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#c0392b"/></marker></defs><text x="8" y="18" font-size="14" text-anchor="start" font-weight="700" fill="#111827">Offset paging</text><text x="338" y="18" font-size="14" text-anchor="start" font-weight="700" fill="#111827">Cursor paging</text><line x1="322" y1="10" x2="322" y2="280" stroke="#b9c4de" stroke-width="1" stroke-dasharray="4 4"/><text x="8" y="34" font-size="12" text-anchor="start" font-weight="400" fill="#374151">1. Start: you read page 1 (the first five records)</text><rect x="8" y="42" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="21" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">A</text><rect x="36" y="42" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="49" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">B</text><rect x="64" y="42" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="77" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">C</text><rect x="92" y="42" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="105" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">D</text><rect x="120" y="42" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="133" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">E</text><rect x="148" y="42" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="161" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">F</text><rect x="176" y="42" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="189" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">G</text><rect x="204" y="42" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="217" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">H</text><rect x="232" y="42" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="245" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">I</text><rect x="260" y="42" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="273" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">J</text><text x="8" y="86" font-size="12" text-anchor="start" font-weight="400" fill="#111827">Page 1 = A to E. The next request asks for offset 5.</text><text x="8" y="118" font-size="12" text-anchor="start" font-weight="400" fill="#374151">2. A record N is inserted before you read page 2</text><rect x="8" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="21" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">N</text><rect x="36" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="49" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">A</text><rect x="64" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="77" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">B</text><rect x="92" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="105" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">C</text><rect x="120" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="133" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">D</text><rect x="148" y="126" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#c0392b" stroke-width="2.6"/><text x="161" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">E</text><rect x="176" y="126" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="189" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">F</text><rect x="204" y="126" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="217" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">G</text><rect x="232" y="126" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="245" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">H</text><rect x="260" y="126" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="273" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">I</text><rect x="288" y="126" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="301" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">J</text><text x="8" y="170" font-size="12" text-anchor="start" font-weight="600" fill="#a52a1e">Page 2 starts at E again: E is read twice.</text><text x="8" y="202" font-size="12" text-anchor="start" font-weight="400" fill="#374151">3. Or A is deleted before you read page 2</text><rect x="8" y="210" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="21" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">B</text><rect x="36" y="210" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="49" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">C</text><rect x="64" y="210" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="77" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">D</text><rect x="92" y="210" width="26" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="105" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">E</text><rect x="120" y="210" width="26" height="26" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="133" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">F</text><rect x="148" y="210" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="161" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">G</text><rect x="176" y="210" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="189" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">H</text><rect x="204" y="210" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="217" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">I</text><rect x="232" y="210" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="245" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">J</text><rect x="260" y="210" width="26" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="273" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">K</text><text x="8" y="254" font-size="12" text-anchor="start" font-weight="600" fill="#a52a1e">Page 2 starts at G: F is never read.</text><text x="338" y="34" font-size="12" text-anchor="start" font-weight="400" fill="#374151">1. Start: you read page 1, and keep the cursor "after E"</text><rect x="338" y="42" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="350" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">A</text><rect x="364" y="42" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="376" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">B</text><rect x="390" y="42" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="402" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">C</text><rect x="416" y="42" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="428" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">D</text><rect x="442" y="42" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="454" y="60" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">E</text><rect x="468" y="42" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="480" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">F</text><rect x="494" y="42" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="506" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">G</text><rect x="520" y="42" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="532" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">H</text><rect x="546" y="42" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="558" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">I</text><rect x="572" y="42" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="584" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">J</text><text x="338" y="86" font-size="12" text-anchor="start" font-weight="400" fill="#111827">The cursor records the last item seen.</text><text x="338" y="118" font-size="12" text-anchor="start" font-weight="400" fill="#374151">2. A record N is inserted: the bookmark does not move</text><rect x="338" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="350" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">N</text><rect x="364" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="376" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">A</text><rect x="390" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="402" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">B</text><rect x="416" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="428" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">C</text><rect x="442" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="454" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">D</text><rect x="468" y="126" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="480" y="144" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">E</text><rect x="494" y="126" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="506" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">F</text><rect x="520" y="126" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="532" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">G</text><rect x="546" y="126" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="558" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">H</text><rect x="572" y="126" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="584" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">I</text><rect x="598" y="126" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="610" y="144" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">J</text><text x="338" y="170" font-size="12" text-anchor="start" font-weight="600" fill="#1e6b46">Page 2 = records after E: F to J. No repeat.</text><text x="338" y="202" font-size="12" text-anchor="start" font-weight="400" fill="#374151">3. Or A is deleted: the bookmark still holds</text><rect x="338" y="210" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="350" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">B</text><rect x="364" y="210" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="376" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">C</text><rect x="390" y="210" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="402" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">D</text><rect x="416" y="210" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="428" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">E</text><rect x="442" y="210" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="454" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">F</text><rect x="468" y="210" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="480" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">G</text><rect x="494" y="210" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="506" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">H</text><rect x="520" y="210" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="532" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">I</text><rect x="546" y="210" width="24" height="26" rx="4" fill="#ffe9a3" stroke="#111827" stroke-width="1.8"/><text x="558" y="228" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">J</text><rect x="572" y="210" width="24" height="26" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.2"/><text x="584" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#111827">K</text><text x="338" y="254" font-size="12" text-anchor="start" font-weight="600" fill="#1e6b46">Page 2 = records after E: F to J. Nothing skipped.</text></svg>