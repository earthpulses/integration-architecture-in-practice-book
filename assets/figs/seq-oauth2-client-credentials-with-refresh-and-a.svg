<svg viewBox="0 0 800 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OAuth2 client credentials with refresh and a surprise 401" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><defs><marker id="SQ1mY" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="SQ1mB" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="SQ1mG" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="SQ1mO" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker></defs><rect width="800" height="660" fill="#ffffff"/><line x1="115.0" y1="48" x2="115.0" y2="646" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="32.0" y="8" width="166" height="40" rx="9" fill="#f0f4fb" stroke="#111827" stroke-width="1.8"/><text x="115.0" y="24.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Integration</text><text x="115.0" y="40.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">job</text><line x1="305.0" y1="48" x2="305.0" y2="646" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="222.0" y="8" width="166" height="40" rx="9" fill="#f0f4fb" stroke="#2f6db5" stroke-width="1.8"/><text x="305.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Token cache</text><line x1="495.0" y1="48" x2="495.0" y2="646" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="412.0" y="8" width="166" height="40" rx="9" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="495.0" y="24.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Authorization</text><text x="495.0" y="40.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">server</text><line x1="685.0" y1="48" x2="685.0" y2="646" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="602.0" y="8" width="166" height="40" rx="9" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="685.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Target API</text><line x1="119.0" y1="100" x2="301.0" y2="100" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="210.0" y="93" fill="#111827" font-size="12.5" text-anchor="middle">get token</text><circle cx="133.0" cy="100" r="8.5" fill="#111827"/><text x="133.0" y="104.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text><line x1="301.0" y1="140" x2="119.0" y2="140" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ1mG)"/><text x="210.0" y="133" fill="#111827" font-size="12.5" text-anchor="middle">miss or near expiry</text><circle cx="287.0" cy="140" r="8.5" fill="#111827"/><text x="287.0" y="144.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text><line x1="119.0" y1="180" x2="491.0" y2="180" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="305.0" y="173" fill="#111827" font-size="12.5" text-anchor="middle">POST /token (client id + secret)</text><circle cx="133.0" cy="180" r="8.5" fill="#111827"/><text x="133.0" y="184.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text><line x1="491.0" y1="220" x2="119.0" y2="220" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ1mG)"/><text x="305.0" y="213" fill="#111827" font-size="12.5" text-anchor="middle">access_token, expires_in</text><circle cx="477.0" cy="220" r="8.5" fill="#111827"/><text x="477.0" y="224.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text><rect x="53.0" y="234" width="314.0" height="44" rx="7" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="210.0" y="251" fill="#111827" font-size="12.5" text-anchor="middle">Cache until about 80% of expires_in. Never log</text><text x="210.0" y="267" fill="#111827" font-size="12.5" text-anchor="middle">the token.</text><line x1="119.0" y1="318" x2="681.0" y2="318" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="400.0" y="311" fill="#111827" font-size="12.5" text-anchor="middle">GET /resource  Bearer</text><circle cx="133.0" cy="318" r="8.5" fill="#111827"/><text x="133.0" y="322.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text><line x1="681.0" y1="358" x2="119.0" y2="358" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ1mG)"/><text x="400.0" y="351" fill="#111827" font-size="12.5" text-anchor="middle">200 OK</text><circle cx="667.0" cy="358" r="8.5" fill="#111827"/><text x="667.0" y="362.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text><line x1="20" y1="382" x2="780" y2="382" stroke="#111827" stroke-dasharray="3 5" stroke-opacity=".7"/><rect x="24" y="373" width="212.0" height="18" rx="4" fill="#ffe9a3" stroke="#111827"/><text x="31.0" y="386" fill="#5c4300" font-size="12.5" font-weight="700">Token revoked or expired early</text><line x1="119.0" y1="430" x2="681.0" y2="430" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="400.0" y="423" fill="#111827" font-size="12.5" text-anchor="middle">GET /resource  Bearer</text><circle cx="133.0" cy="430" r="8.5" fill="#111827"/><text x="133.0" y="434.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">7</text><g><circle cx="400.0" cy="444" r="9" fill="#c0392b" stroke="#7a1a14"/><text x="400.0" y="448.5" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">A</text></g><line x1="681.0" y1="470" x2="119.0" y2="470" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ1mG)"/><text x="400.0" y="463" fill="#111827" font-size="12.5" text-anchor="middle">401 Unauthorized</text><circle cx="667.0" cy="470" r="8.5" fill="#111827"/><text x="667.0" y="474.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">8</text><line x1="119.0" y1="510" x2="491.0" y2="510" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="305.0" y="503" fill="#111827" font-size="12.5" text-anchor="middle">fetch a new token (once)</text><circle cx="133.0" cy="510" r="8.5" fill="#111827"/><text x="133.0" y="514.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">9</text><line x1="119.0" y1="550" x2="681.0" y2="550" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ1mY)"/><text x="400.0" y="543" fill="#111827" font-size="12.5" text-anchor="middle">retry the call once</text><circle cx="133.0" cy="550" r="8.5" fill="#111827"/><text x="133.0" y="554.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">10</text><line x1="681.0" y1="590" x2="119.0" y2="590" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ1mG)"/><text x="400.0" y="583" fill="#111827" font-size="12.5" text-anchor="middle">200 OK</text><circle cx="667.0" cy="590" r="8.5" fill="#111827"/><text x="667.0" y="594.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">11</text><rect x="53.0" y="604" width="694.0" height="28" rx="7" fill="#fbe2df" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="621" fill="#7a1a14" font-size="12.5" text-anchor="middle">A second 401 means stop and alert. Looping on 401 locks accounts.</text></svg>