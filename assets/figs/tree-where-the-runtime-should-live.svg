.8,389.0 708.8,354.0 724.3,354.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100012)"/><polyline points="696.2,389.0 710.4,389.0 710.4,424.0 727.8,424.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100012)"/><polygon points="114.6,204.0 206.6,242.0 114.6,280.0 22.6,242.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="114.6" y="238.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Payloads may leave</text><text x="114.6" y="254.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">network or region?</text><polygon points="344.6,106.0 436.6,144.0 344.6,182.0 252.6,144.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="344.6" y="140.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Customer-hosted</text><text x="344.6" y="156.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">runtime available?</text><rect x="527.7" y="69.0" width="145.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="600.2" y="91.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Use it</text><text x="600.2" y="107.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">(check capacity)</text><rect x="481.7" y="160.0" width="237.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="600.2" y="182.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Containers or VMs: your code</text><text x="600.2" y="198.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or self-hosted runtime</text><polygon points="344.6,302.0 440.6,340.0 344.6,378.0 248.6,340.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="344.6" y="336.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Endpoints reachable</text><text x="344.6" y="352.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">from the internet?</text><rect x="520.2" y="265.0" width="160.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="600.2" y="287.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Vendor-cloud iPaaS</text><text x="600.2" y="303.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or serverless</text><polygon points="600.2,351.0 696.2,389.0 600.2,427.0 504.2,389.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="600.2" y="385.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Outbound-only agent</text><text x="600.2" y="401.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">allowed?</text><rect x="724.3" y="328.0" width="229.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="838.8" y="350.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Agent + cloud control plane</text><text x="838.8" y="366.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">(verify where logic runs)</text><rect x="727.8" y="398.0" width="222.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="838.8" y="420.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Private link or VPN to</text><text x="838.8" y="436.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">a cloud or on-prem runtime</text><rect x="216.7" y="185.5" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="227.3" y="197.0" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="211.6" y="283.5" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="225.5" y="295.0" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="463.7" y="112.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><te