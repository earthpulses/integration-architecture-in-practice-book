<svg viewBox="0 0 790 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Polling with a watermark, and a crash in the middle" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><defs><marker id="SQ2mY" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="SQ2mB" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="SQ2mG" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="SQ2mO" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker></defs><rect width="790" height="700" fill="#ffffff"/><line x1="95.0" y1="48" x2="95.0" y2="686" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="32.0" y="8" width="126" height="40" rx="9" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="95.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Scheduler</text><line x1="245.0" y1="48" x2="245.0" y2="686" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="182.0" y="8" width="126" height="40" rx="9" fill="#f0f4fb" stroke="#111827" stroke-width="1.8"/><text x="245.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Poller</text><line x1="395.0" y1="48" x2="395.0" y2="686" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="332.0" y="8" width="126" height="40" rx="9" fill="#f0f4fb" stroke="#2f6db5" stroke-width="1.8"/><text x="395.0" y="24.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Watermark</text><text x="395.0" y="40.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">store</text><line x1="545.0" y1="48" x2="545.0" y2="686" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="482.0" y="8" width="126" height="40" rx="9" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="545.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Source API</text><line x1="695.0" y1="48" x2="695.0" y2="686" stroke="#b9c4de" stroke-dasharray="4 5"/><rect x="632.0" y="8" width="126" height="40" rx="9" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.8"/><text x="695.0" y="32.0" fill="#111827" font-size="13" font-weight="600" text-anchor="middle">Target</text><line x1="99.0" y1="100" x2="241.0" y2="100" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ2mY)"/><text x="170.0" y="93" fill="#111827" font-size="12.5" text-anchor="middle">tick (every 5 min)</text><circle cx="113.0" cy="100" r="8.5" fill="#111827"/><text x="113.0" y="104.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text><line x1="249.0" y1="140" x2="391.0" y2="140" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ2mY)"/><text x="320.0" y="133" fill="#111827" font-size="12.5" text-anchor="middle">read watermark T0</text><circle cx="263.0" cy="140" r="8.5" fill="#111827"/><text x="263.0" y="144.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text><line x1="391.0" y1="180" x2="249.0" y2="180" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ2mG)"/><text x="320.0" y="173" fill="#111827" font-size="12.5" text-anchor="middle">T0</text><circle cx="377.0" cy="180" r="8.5" fill="#111827"/><text x="377.0" y="184.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text><line x1="249.0" y1="220" x2="541.0" y2="220" stroke="#2f6db5" stroke-width="2.4" marker-end="url(#SQ2mB)"/><text x="395.0" y="213" fill="#111827" font-size="12.5" text-anchor="middle">GET modified_since = T0 minus 2 min</text><circle cx="263.0" cy="220" r="8.5" fill="#111827"/><text x="263.0" y="224.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text><line x1="541.0" y1="260" x2="249.0" y2="260" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ2mG)"/><text x="395.0" y="253" fill="#111827" font-size="12.5" text-anchor="middle">page 1 + next cursor</text><circle cx="527.0" cy="260" r="8.5" fill="#111827"/><text x="527.0" y="264.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text><line x1="249.0" y1="300" x2="691.0" y2="300" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ2mY)"/><text x="470.0" y="293" fill="#111827" font-size="12.5" text-anchor="middle">upsert page 1 (idempotent)</text><circle cx="263.0" cy="300" r="8.5" fill="#111827"/><text x="263.0" y="304.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text><line x1="249.0" y1="340" x2="541.0" y2="340" stroke="#2f6db5" stroke-width="2.4" marker-end="url(#SQ2mB)"/><text x="395.0" y="333" fill="#111827" font-size="12.5" text-anchor="middle">GET page 2 (cursor)</text><circle cx="263.0" cy="340" r="8.5" fill="#111827"/><text x="263.0" y="344.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">7</text><line x1="541.0" y1="380" x2="249.0" y2="380" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ2mG)"/><text x="395.0" y="373" fill="#111827" font-size="12.5" text-anchor="middle">page 2, last page</text><circle cx="527.0" cy="380" r="8.5" fill="#111827"/><text x="527.0" y="384.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">8</text><line x1="249.0" y1="420" x2="691.0" y2="420" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ2mY)"/><text x="470.0" y="413" fill="#111827" font-size="12.5" text-anchor="middle">upsert page 2</text><circle cx="263.0" cy="420" r="8.5" fill="#111827"/><text x="263.0" y="424.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">9</text><g><circle cx="470.0" cy="434" r="9" fill="#c0392b" stroke="#7a1a14"/><text x="470.0" y="438.5" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">A</text></g><line x1="20" y1="444" x2="770" y2="444" stroke="#111827" stroke-dasharray="3 5" stroke-opacity=".7"/><rect x="24" y="435" width="205.4" height="18" rx="4" fill="#ffe9a3" stroke="#111827"/><text x="31.0" y="448" fill="#5c4300" font-size="12.5" font-weight="700">Crash or error before the end</text><rect x="183.0" y="466" width="274.0" height="60" rx="7" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.5"/><text x="320.0" y="483" fill="#0d4d33" font-size="12.5" text-anchor="middle">Watermark NOT advanced. The next run</text><text x="320.0" y="499" fill="#0d4d33" font-size="12.5" text-anchor="middle">starts from T0 again, re-reads pages 1</text><text x="320.0" y="515" fill="#0d4d33" font-size="12.5" text-anchor="middle">and 2, and upserts change nothing.</text><line x1="20" y1="550" x2="770" y2="550" stroke="#111827" stroke-dasharray="3 5" stroke-opacity=".7"/><rect x="24" y="541" width="106.4" height="18" rx="4" fill="#ffe9a3" stroke="#111827"/><text x="31.0" y="554" fill="#5c4300" font-size="12.5" font-weight="700">Successful run</text><line x1="249.0" y1="598" x2="391.0" y2="598" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ2mY)"/><text x="320.0" y="591" fill="#111827" font-size="12.5" text-anchor="middle">save max modified seen</text><circle cx="263.0" cy="598" r="8.5" fill="#111827"/><text x="263.0" y="602.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">10</text><rect x="183.0" y="612" width="274.0" height="60" rx="7" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="320.0" y="629" fill="#111827" font-size="12.5" text-anchor="middle">Use the maximum timestamp actually</text><text x="320.0" y="645" fill="#111827" font-size="12.5" text-anchor="middle">received, never "now" from your own</text><text x="320.0" y="661" fill="#111827" font-size="12.5" text-anchor="middle">clock.</text></svg>