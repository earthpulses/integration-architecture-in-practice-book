<svg viewBox="0 0 900 300" role="img" aria-label="Bidirectional sync flow with loop prevention">
<rect width="900" height="300" fill="#ffffff"/>
<g font-size="14" fill="#e8eeff">
<rect x="30" y="30" width="190" height="70" rx="10" fill="#f0f4fb" stroke="#111827"/><text x="125" y="60" text-anchor="middle" fill="#111827" font-weight="700">System A</text><text x="125" y="82" text-anchor="middle">change history</text>
<rect x="680" y="30" width="190" height="70" rx="10" fill="#f0f4fb" stroke="#111827"/><text x="775" y="60" text-anchor="middle" fill="#111827" font-weight="700">System B</text><text x="775" y="82" text-anchor="middle">audit log</text>
<rect x="290" y="20" width="320" height="90" rx="10" fill="#e4ebf7" stroke="#b9c4de"/><text x="450" y="48" text-anchor="middle" fill="#111827" font-weight="700">Integration run</text>
<text x="450" y="72" text-anchor="middle">1 fetch changes since checkpoints</text><text x="450" y="94" text-anchor="middle">2 drop changes made by the integration user</text>
<rect x="290" y="150" width="320" height="120" rx="10" fill="#e4ebf7" stroke="#b9c4de"/>
<text x="450" y="176" text-anchor="middle">3 merge both lists, sort by time</text>
<text x="450" y="198" text-anchor="middle">4 lock the record (skip if locked)</text>
<text x="450" y="220" text-anchor="middle">5 apply per field authority and mapping</text>
<text x="450" y="242" text-anchor="middle">6 advance checkpoints, release lock</text>
<line x1="220" y1="65" x2="290" y2="65" stroke="#111827" stroke-width="2"/>
<line x1="680" y1="65" x2="610" y2="65" stroke="#111827" stroke-width="2"/>
<line x1="450" y1="110" x2="450" y2="150" stroke="#111827" stroke-width="2"/>
</g></svg>