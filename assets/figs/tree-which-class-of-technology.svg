827" font-size="13.5" text-anchor="middle" font-weight="500">messaging (MQ)</text><polygon points="123.1,401.6 211.1,439.6 123.1,477.6 35.1,439.6" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="123.1" y="435.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Engineering-led,</text><text x="123.1" y="451.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">Git and CI first?</text><rect x="301.8" y="413.6" width="222.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="412.8" y="435.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Code-first or cloud-native</text><text x="412.8" y="451.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">services</text><rect x="16.1" y="488.0" width="214.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="123.1" y="510.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">iPaaS with an engineering</text><text x="123.1" y="526.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">overlay (Git, CI)</text><rect x="290.8" y="60.1" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="304.7" y="71.6" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="127.1" y="97.3" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="130.1" y="108.8" fill="#111827" font-size="12" text-anchor="start">no</text><rect x="279.5" y="134.5" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="293.4" y="146.0" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="127.1" y="171.7" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="130.1" y="183.2" fill="#111827" font-size="12" text-anchor="start">no</text><rect x="277.1" y="208.9" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="291.0" y="220.4" fill="#1118