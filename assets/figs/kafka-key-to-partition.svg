"#2f6db5" stroke-width="1.6"/><text x="426" y="62" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">o1 shipped</text><line x1="358" y1="57" x2="366" y2="57" stroke="#111827" stroke-width="1.4" marker-end="url(#mink)"/><text x="8" y="119" font-size="12.5" text-anchor="start" font-weight="700" fill="#111827">Partition 1</text><text x="8" y="135" font-size="11.5" text-anchor="start" font-weight="400" fill="#4b5563">key: order 2</text><rect x="110" y="98" width="120" height="34" rx="6" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.6"/><text x="170" y="120" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">o2 created</text><rect x="238" y="98" width="120" height="34" rx="6" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.6"/><text x="298" y="120" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">o2 paid</text><line x1="230" y1="115" x2="238" y2="115" stroke="#111827" stroke-width="1.4" marker-end="url(#mink)"/><text x="8" y="177" font-size="12.5" text-anchor="start" font-weight="700" fill="#111827">Partition 2</text><text x="8" y="193" font-size="11.5" text-anchor="start" font-weight="400" fill="#4b5563">key: order 3</text><rect x="110" y="156" width="120" height="34" rx="6" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.6"/><text x="170" y="178" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">o3 created</text><rect x="238" y="156" width="120" height="34" rx="6" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.6"/><text x="298" y="178" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">o3 cancelled</text><line x1="230" y1="173" x2="238" y2="173" stroke="#111827" stroke-width="1.4" marker-end="url(#mink)"/><text x="8" y="222" font-size="12" text-anchor="start" font-weight="400" fill="#374151">Order is guaranteed within a partition (o1 created, then paid, then shipped) and not across partitions.</text></svg>