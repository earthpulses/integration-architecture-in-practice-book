<svg viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Integration journey with approval gates" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><rect width="960" height="330" fill="#ffffff"/><polygon points="20,24 134,24 148,60 134,96 20,96 34,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="82" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Discover</text><polygon points="170,24 284,24 298,60 284,96 170,96 184,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="232" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Design</text><polygon points="320,24 434,24 448,60 434,96 320,96 334,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="382" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Build</text><polygon points="470,24 584,24 598,60 584,96 470,96 484,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="532" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Test</text><polygon points="620,24 734,24 748,60 734,96 620,96 634,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="682" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Release</text><polygon points="770,24 884,24 898,60 884,96 770,96 784,60" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="832" y="66" fill="#111827" font-size="15" font-weight="700" text-anchor="middle">Operate</text><polygon points="159,60 159,44 159,60 159,76" fill="#111827" stroke="#111827"/><text x="159" y="65" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">G1</text><polygon points="309,60 309,44 309,60 309,76" fill="#111827" stroke="#111827"/><text x="309" y="65" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">G2</text><polygon points="609,60 609,44 609,60 609,76" fill="#111827" stroke="#111827"/><text x="609" y="65" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">G3</text><polygon points="759,60 759,44 759,60 759,76" fill="#111827" stroke="#111827"/><text x="759" y="65" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">G4</text><g><polygon points="159,42 176,60 159,78 142,60" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="159" y="64" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">G1</text></g><g><polygon points="309,42 326,60 309,78 292,60" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="309" y="64" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">G2</text></g><g><polygon points="609,42 626,60 609,78 592,60" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="609" y="64" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">G3</text></g><g><polygon points="759,42 776,60 759,78 742,60" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="759" y="64" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">G4</text></g><rect x="16" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="22" y="145" fill="#111827" font-size="11.5">Brief, authority</text><text x="22" y="160" fill="#111827" font-size="11.5">matrix, four numbers</text><rect x="166" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="172" y="145" fill="#111827" font-size="11.5">Pattern, contracts,</text><text x="172" y="160" fill="#111827" font-size="11.5">ADRs, security and</text><text x="172" y="175" fill="#111827" font-size="11.5">network design</text><rect x="316" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="322" y="145" fill="#111827" font-size="11.5">Flows or code,</text><text x="322" y="160" fill="#111827" font-size="11.5">mappings as config,</text><text x="322" y="175" fill="#111827" font-size="11.5">IaC</text><rect x="466" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="472" y="145" fill="#111827" font-size="11.5">Contract, failure and</text><text x="472" y="160" fill="#111827" font-size="11.5">volume tests,</text><text x="472" y="175" fill="#111827" font-size="11.5">reconcile report</text><rect x="616" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="622" y="145" fill="#111827" font-size="11.5">Go-live checklist,</text><text x="622" y="160" fill="#111827" font-size="11.5">backfill, rollback</text><text x="622" y="175" fill="#111827" font-size="11.5">plan</text><rect x="766" y="128" width="140" height="65" rx="8" fill="#f0f4fb" stroke="#b9c4de"/><text x="772" y="145" fill="#111827" font-size="11.5">Alerts, runbook,</text><text x="772" y="160" fill="#111827" font-size="11.5">reconcile schedule</text><rect x="16" y="228" width="140" height="65" rx="8" fill="#fff6d6" stroke="#111827"/><text x="22" y="245" fill="#111827" font-size="11.5">G1: critical questions</text><text x="22" y="260" fill="#111827" font-size="11.5">answered</text><rect x="166" y="228" width="140" height="65" rx="8" fill="#fff6d6" stroke="#111827"/><text x="172" y="245" fill="#111827" font-size="11.5">G2: security, network,</text><text x="172" y="260" fill="#111827" font-size="11.5">contracts approved</text><rect x="466" y="228" width="140" height="65" rx="8" fill="#fff6d6" stroke="#111827"/><text x="472" y="245" fill="#111827" font-size="11.5">G3: tests pass,</text><text x="472" y="260" fill="#111827" font-size="11.5">runbook accepted</text><rect x="616" y="228" width="140" height="65" rx="8" fill="#fff6d6" stroke="#111827"/><text x="622" y="245" fill="#111827" font-size="11.5">G4: ops owner</text><text x="622" y="260" fill="#111827" font-size="11.5">confirms, hypercare</text><text x="622" y="275" fill="#111827" font-size="11.5">exits</text><text x="20" y="320" fill="#4b5563" font-size="12.5" font-style="italic">A gate is a decision, not a meeting: it passes only when its criteria are evidenced, and failures are recorded as risks with owners.</text></svg>