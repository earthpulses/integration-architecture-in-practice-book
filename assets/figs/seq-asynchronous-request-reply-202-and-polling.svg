1.6" marker-end="url(#SQ4mG)"/><text x="195.0" y="453" fill="#111827" font-size="12.5" text-anchor="middle">303 See Other: result URL</text><circle cx="264.5" cy="460" r="8.5" fill="#111827"/><text x="264.5" y="464.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">10</text><rect x="45.5" y="474" width="824.0" height="44" rx="7" fill="#e4ebf7" stroke="#2f6db5" stroke-width="1.5"/><text x="457.5" y="491" fill="#111827" font-size="12.5" text-anchor="middle">Results expire: collect them within the retention window, and make the submit idempotent so a retry does not create a second</text><text x="457.5" y="507" fill="#111827" font-size="12.5" text-anchor="middle">job.</text></svg>