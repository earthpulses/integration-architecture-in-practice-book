<svg viewBox="0 0 876 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pattern family decision tree" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><defs><marker id="mY17" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="mB17" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="mG17" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="mO17" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker></defs><rect width="876" height="456" fill="#ffffff"/><line x1="141.3" y1="202.0" x2="258.7" y2="144.8" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="384.0" y1="103.6" x2="485.0" y2="82.2" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="384.0" y1="131.5" x2="466.0" y2="146.0" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="157.3" y1="254.0" x2="242.7" y2="286.0" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="389.0" y1="290.3" x2="480.0" y2="264.6" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="389.0" y1="331.8" x2="431.0" y2="342.6" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="585.0" y1="349.2" x2="683.0" y2="332.4" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="585.0" y1="378.2" x2="688.0" y2="399.4" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><line x1="172.5" y1="429.6" x2="232.0" y2="429.6" stroke="#111827" stroke-width="2.4" marker-end="url(#mY17)"/><polygon points="88.0,190.0 188.0,228.0 88.0,266.0 -12.0,228.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="88.0" y="224.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Must the caller</text><text x="88.0" y="240.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">wait for the answer?</text><polygon points="312.0,80.8 384.0,118.8 312.0,156.8 240.0,118.8" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="312.0" y="114.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">One provider</text><text x="312.0" y="130.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or several?</text><rect x="485.0" y="42.4" width="130.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="550.0" y="64.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Direct call</text><text x="550.0" y="80.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or API gateway</text><rect x="466.0" y="134.8" width="168.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="550.0" y="156.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Orchestration or</text><text x="550.0" y="172.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">API-led composition</text><polygon points="312.0,274.0 389.0,312.0 312.0,350.0 235.0,312.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="312.0" y="308.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">How much data,</text><text x="312.0" y="324.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">how often?</text><rect x="480.0" y="210.8" width="140.0" height="68.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="550.0" y="232.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Bulk, hours OK:</text><text x="550.0" y="248.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">ETL, file drop,</text><text x="550.0" y="264.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">snapshot</text><polygon points="508.0,324.4 585.0,362.4 508.0,400.4 431.0,362.4" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="508.0" y="358.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Many consumers</text><text x="508.0" y="374.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or replay?</text><rect x="683.0" y="294.4" width="140.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="753.0" y="316.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Event streaming</text><text x="753.0" y="332.4" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">+ CDC / outbox</text><rect x="688.0" y="386.8" width="130.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="753.0" y="408.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Queue, webhook</text><text x="753.0" y="424.8" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or polling</text><polygon points="88.0,391.6 172.5,429.6 88.0,467.6 3.5,429.6" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="88.0" y="425.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Source reachable</text><text x="88.0" y="441.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">inbound?</text><rect x="232.0" y="403.6" width="160.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="312.0" y="425.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">No: outbound agent</text><text x="312.0" y="441.6" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">or polling</text><rect x="186.1" y="154.9" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="200.0" y="166.4" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="420.6" y="74.4" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="434.5" y="85.9" fill="#111827" font-size="12" text-anchor="middle">one</text><rect x="407.8" y="120.2" width="34.4" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="425.0" y="131.7" fill="#111827" font-size="12" text-anchor="middle">many</text><rect x="189.4" y="251.5" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="200.0" y="263.0" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="417.3" y="258.9" width="34.4" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="434.5" y="270.4" fill="#111827" font-size="12" text-anchor="middle">bulk</text><rect x="373.0" y="318.7" width="74.0" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="410.0" y="330.2" fill="#111827" font-size="12" text-anchor="middle">continuous</text><rect x="620.1" y="322.3" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="634.0" y="333.8" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="625.9" y="370.3" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="636.5" y="381.8" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="191.7" y="411.1" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="202.2" y="422.6" fill="#111827" font-size="12" text-anchor="middle">no</text></svg>