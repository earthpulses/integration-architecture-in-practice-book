368.0 594.9,333.0 610.0,333.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100011)"/><polyline points="582.5,368.0 591.5,368.0 591.5,403.0 602.5,403.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100011)"/><polyline points="177.0,473.0 195.2,473.0 195.2,452.0 217.5,452.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100011)"/><polyline points="177.0,473.0 189.8,473.0 189.8,515.0 205.5,515.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100011)"/><polygon points="89.0,190.0 177.0,228.0 89.0,266.0 1.0,228.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="89.0" y="224.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Idempotent upsert</text><text x="89.0" y="240.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">by key?</text><polygon points="293.5,99.0 385.5,137.0 293.5,175.0 201.5,137.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="293.5" y="133.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Over ~100k records</text><text x="293.5" y="149.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">per run?</text><rect x="422.0" y="62.0" width="152.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="498.0" y="84.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Bulk / import API</text><text x="498.0" y="100.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">in batches</text><rect x="414.0" y="139.0" width="168.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="498.0" y="161.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Upsert per record +</text><text x="498.0" y="177.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">rate limiter</text><polygon points="293.5,281.0 381.5,319.0 293.5,357.0 205.5,319.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="293.5" y="315.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Idempotency-key</text><text x="293.5" y="331.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">header supported?</text><rect x="422.0" y="244.0" width="152.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="498.0" y="266.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Create with key +</text><text x="498.0" y="282.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">dedupe ledger</text><polygon points="498.0,330.0 582.5,368.0 498.0,406.0 413.5,368.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="498.0" y="364.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Can you read to</text><text x="498.0" y="380.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">check existence?</text><rect x="610.0" y="307.0" width="253.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="736.5" y="329.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Lookup then write; stored</text><text x="736.5" y="345.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">foreign ID; one writer per key</text><rect x="602.5" y="377.0" width="268.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="736.5" y="399.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Single-writer queue + reconcile;</text><text x="736.5" y="415.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">ask vendor for upsert</text><polygon points="89.0,435.0 177.0,473.0 89.0,511.0 1.0,473.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="89.0" y="469.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Strict rate limit</text><text x="89.0" y="485.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">on the target?</text><rect x="217.5" y="426.0" width="152.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="293.5" y="448.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Queue + throttle;</text><text x="293.5" y="464.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">backoff on 429</text><rect x="205.5" y="489.0" width="176.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="293.5" y="511.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Direct calls with</text><text x="293.5" y="527.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">timeouts and retries</text><rect x="174.1" y="175.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="188.0" y="186.5" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="179.2" y="266.0" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="189.8" y="277.5" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="388.0" y="105.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="401.9" y="116.5" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="387.7" y="143.5" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="398.3" y="155.0" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="385.8" y="287.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="399.7" y="298.5" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="385.3" y="336.0" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="395.9" y="347.5" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="581.0" y