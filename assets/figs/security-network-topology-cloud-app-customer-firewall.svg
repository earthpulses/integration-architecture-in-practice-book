<svg viewBox="0 0 900 320" role="img" aria-label="Network topology: cloud app, customer firewall, integration server, catalog cloud">
<rect width="900" height="320" fill="#ffffff"/>
<g font-size="14" fill="#e8eeff">
<rect x="20" y="40" width="230" height="230" rx="12" fill="#f0f4fb" stroke="#b9c4de"/><text x="135" y="66" text-anchor="middle" fill="#111827" font-weight="700">Source system cloud</text>
<rect x="45" y="100" width="180" height="60" rx="8" fill="#e4ebf7" stroke="#b9c4de"/><text x="135" y="134" text-anchor="middle">Source APIs</text>
<text x="135" y="200" text-anchor="middle" fill="#4b5563" font-size="12.5">allowlist: customer</text><text x="135" y="218" text-anchor="middle" fill="#4b5563" font-size="12.5">egress IP only</text>
<rect x="330" y="40" width="240" height="230" rx="12" fill="#f0f4fb" stroke="#111827"/><text x="450" y="66" text-anchor="middle" fill="#111827" font-weight="700">Customer network</text>
<rect x="360" y="100" width="180" height="70" rx="8" fill="#e4ebf7" stroke="#111827"/><text x="450" y="130" text-anchor="middle">Integration server</text><text x="450" y="150" text-anchor="middle" fill="#4b5563" font-size="12.5">Python job + vault client</text>
<text x="450" y="200" text-anchor="middle" fill="#4b5563" font-size="12.5">outbound HTTPS only,</text><text x="450" y="218" text-anchor="middle" fill="#4b5563" font-size="12.5">via corporate proxy</text><text x="450" y="244" text-anchor="middle" fill="#a52a1e" font-size="12.5">firewall boundary</text>
<rect x="650" y="40" width="230" height="230" rx="12" fill="#f0f4fb" stroke="#b9c4de"/><text x="765" y="66" text-anchor="middle" fill="#111827" font-weight="700">Catalog cloud</text>
<rect x="675" y="100" width="180" height="60" rx="8" fill="#e4ebf7" stroke="#b9c4de"/><text x="765" y="134" text-anchor="middle">Catalog APIs</text>
<line x1="330" y1="135" x2="225" y2="135" stroke="#111827" stroke-width="2.5"/><line x1="570" y1="135" x2="675" y2="135" stroke="#111827" stroke-width="2.5"/>
<text x="278" y="124" text-anchor="middle" font-size="12" fill="#4b5563">pull</text><text x="622" y="124" text-anchor="middle" font-size="12" fill="#4b5563">push</text>
<text x="450" y="300" text-anchor="middle" fill="#4b5563" font-size="13">Both connections are initiated from inside the customer network: no inbound ports opened</text>
</g></svg>