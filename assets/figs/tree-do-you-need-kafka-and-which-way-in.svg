<svg viewBox="0 0 1030 386" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree: Kafka and the way in" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif"><defs><marker id="mY100014" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="mB100014" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f6db5"/></marker><marker id="mG100014" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#6b7280"/></marker><marker id="mO100014" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2d8a5f"/></marker></defs><rect width="1030" height="386" fill="#ffffff"/><polyline points="177.0,207.0 206.1,207.0 206.1,81.0 241.6,81.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polyline points="177.0,207.0 217.8,207.0 217.8,256.0 267.6,256.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polyline points="421.6,256.0 471.4,256.0 471.4,151.0 532.2,151.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polyline points="421.6,256.0 461.5,256.0 461.5,214.0 510.2,214.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polyline points="421.6,256.0 459.7,256.0 459.7,277.0 506.2,277.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polyline points="421.6,256.0 459.7,256.0 459.7,340.0 506.2,340.0" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#mY100014)"/><polygon points="89.0,161.0 177.0,207.0 89.0,253.0 1.0,207.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="89.0" y="195.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Need replay, many</text><text x="89.0" y="211.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">consumers or high</text><text x="89.0" y="227.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">throughput?</text><rect x="241.6" y="55.0" width="206.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="344.6" y="77.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Not Kafka: poll, webhook</text><text x="344.6" y="93.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">+ queue, or iPaaS</text><polygon points="344.6,218.0 421.6,256.0 344.6,294.0 267.6,256.0" fill="#fff6d6" stroke="#111827" stroke-width="1.8"/><text x="344.6" y="252.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Where does the</text><text x="344.6" y="268.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">data enter?</text><rect x="532.2" y="125.0" width="170.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="617.2" y="147.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">Your own service:</text><text x="617.2" y="163.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">producer (+ outbox)</text><rect x="510.2" y="188.0" width="214.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="617.2" y="210.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">A database:</text><text x="617.2" y="226.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">CDC (JDBC poll if simple)</text><rect x="506.2" y="251.0" width="222.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="617.2" y="273.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">SaaS / webhooks: HTTP</text><text x="617.2" y="289.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">gateway or iPaaS publishes</text><rect x="506.2" y="314.0" width="222.0" height="52.0" rx="9" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.8"/><text x="617.2" y="336.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="600">MQ, files, MQTT:</text><text x="617.2" y="352.0" fill="#111827" font-size="13.5" text-anchor="middle" font-weight="500">source connector or bridge</text><rect x="195.5" y="136.5" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="206.1" y="148.0" fill="#111827" font-size="12" text-anchor="middle">no</text><rect x="203.9" y="224.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="217.8" y="235.5" fill="#111827" font-size="12" text-anchor="middle">yes</text><rect x="457.5" y="196.0" width="27.8" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="471.4" y="207.5" fill="#111827" font-size="12" text-anchor="middle">app</text><rect x="450.9" y="227.5" width="21.2" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="461.5" y="239.0" fill="#111827" font-size="12" text-anchor="middle">DB</text><rect x="465.8" y="269.5" width="34.4" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="483.0" y="281.0" fill="#111827" font-size="12" text-anchor="middle">SaaS</text><rect x="435.9" y="290.5" width="47.6" height="15" rx="3" fill="#ffffff" fill-opacity=".88"/><text x="459.7" y="302.0" fill="#111827" font-size="12" text-anchor="middle">legacy</text></svg>