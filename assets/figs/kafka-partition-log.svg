roke-width="1.4"/><text x="440.5" y="106" font-size="14" text-anchor="middle" font-weight="600" fill="#111827">B</text><text x="440.5" y="136" font-size="12" text-anchor="middle" font-weight="400" fill="#4b5563">9</text><rect x="464" y="84" width="41" height="34" rx="4" fill="#e4ebf7" stroke="#b9c4de" stroke-width="1.4"/><text x="484.5" y="106" font-size="14" text-anchor="middle" font-weight="600" fill="#111827">A</text><text x="484.5" y="136" font-size="12" text-anchor="middle" font-weight="400" fill="#4b5563">10</text><rect x="508" y="84" width="41" height="34" rx="4" fill="#fff" stroke="#111827" stroke-width="1.4" stroke-dasharray="4 3"/><text x="528.5" y="106" font-size="14" text-anchor="middle" font-weight="600" fill="#111827"></text><text x="528.5" y="136" font-size="12" text-anchor="middle" font-weight="400" fill="#4b5563">11</text><text x="24" y="74" font-size="12" text-anchor="start" font-weight="400" fill="#4b5563">offset (position) of each record; letters are record keys</text><line x1="528" y1="50" x2="528" y2="82" stroke="#111827" stroke-width="1.8" marker-end="url(#mink)"/><text x="528" y="44" font-size="12" text-anchor="end" font-weight="600" fill="#111827">producers append here</text><text x="620" y="166" font-size="12" text-anchor="end" font-weight="600" fill="#111827">log end: the next record gets offset 11</text><line x1="396" y1="188" x2="396" y2="140" stroke="#2f6db5" stroke-width="1.8" marker-end="url(#mblue)"/><text x="396" y="204" font-size="12" text-anchor="middle" font-weight="600" fill="#1f4f8f">group "billing": committed offset 8</text><text x="396" y="219" font-size="12" text-anchor="middle" font-weight="400" fill="#1f4f8f">lag = 3 records</text><line x1="176" y1="188" x2="176" y2="140" stroke="#2d8a5f" stroke-width="1.8" marker-end="url(#mgreen)"/><text x="176" y="204" font-size="12" text-anchor="middle" font-weight="600" fill="#1e6b46">group "search": committed offset 3</text><text x="176" y="219" font-size="12" text-anchor="middle" font-weight="400" fill="#1e6b46">lag = 8, can replay from 0</text><text x="8" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#374151">Reading does not delete anything: each group keeps its own bookmark, and records live until retention expires.</text></svg>