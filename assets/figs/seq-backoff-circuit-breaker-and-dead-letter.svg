chor="middle">Wait: exponential backoff with full jitter,</text><text x="190.0" y="267" fill="#111827" font-size="12.5" text-anchor="middle">honour Retry-After.</text><line x1="109.0" y1="318" x2="271.0" y2="318" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ8mY)"/><text x="190.0" y="311" fill="#111827" font-size="12.5" text-anchor="middle">call (retry 2)</text><circle cx="123.0" cy="318" r="8.5" fill="#111827"/><text x="123.0" y="322.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text><line x1="279.0" y1="358" x2="441.0" y2="358" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ8mY)"/><text x="360.0" y="351" fill="#111827" font-size="12.5" text-anchor="middle">request</text><circle cx="293.0" cy="358" r="8.5" fill="#111827"/><text x="293.0" y="362.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text><line x1="441.0" y1="398" x2="279.0" y2="398" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ8mG)"/><text x="360.0" y="391" fill="#111827" font-size="12.5" text-anchor="middle">503</text><circle cx="427.0" cy="398" r="8.5" fill="#111827"/><text x="427.0" y="402.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">7</text><rect x="213.0" y="412" width="294.0" height="60" rx="7" fill="#fbe2df" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="429" fill="#7a1a14" font-size="12.5" text-anchor="middle">Failure threshold reached: breaker OPEN.</text><text x="360.0" y="445" fill="#7a1a14" font-size="12.5" text-anchor="middle">Pause consumption instead of hammering the</text><text x="360.0" y="461" fill="#7a1a14" font-size="12.5" text-anchor="middle">target.</text><line x1="109.0" y1="512" x2="271.0" y2="512" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ8mY)"/><text x="190.0" y="505" fill="#111827" font-size="12.5" text-anchor="middle">call</text><circle cx="123.0" cy="512" r="8.5" fill="#111827"/><text x="123.0" y="516.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">8</text><line x1="271.0" y1="552" x2="109.0" y2="552" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ8mG)"/><text x="190.0" y="545" fill="#111827" font-size="12.5" text-anchor="middle">fail fast (open)</text><circle cx="257.0" cy="552" r="8.5" fill="#111827"/><text x="257.0" y="556.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">9</text><line x1="20" y1="576" x2="700" y2="576" stroke="#111827" stroke-dasharray="3 5" stroke-opacity=".7"/><rect x="24" y="567" width="231.8" height="18" rx="4" fill="#ffe9a3" stroke="#111827"/><text x="31.0" y="580" fill="#5c4300" font-size="12.5" font-weight="700">Cool-down passes: half-open probe</text><line x1="279.0" y1="624" x2="441.0" y2="624" stroke="#111827" stroke-width="2.4" marker-end="url(#SQ8mY)"/><text x="360.0" y="617" fill="#111827" font-size="12.5" text-anchor="middle">probe</text><circle cx="293.0" cy="624" r="8.5" fill="#111827"/><text x="293.0" y="628.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">10</text><line x1="441.0" y1="664" x2="279.0" y2="664" stroke="#6b7280" stroke-width="1.6" marker-end="url(#SQ8mG)"/><text x="360.0" y="657" fill="#111827" font-size="12.5" text-anchor="middle">200</text><circle cx="427.0" cy="664" r="8.5" fill="#111827"/><text x="427.0" y="668.0" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">11</text><rect x="43.0" y="678" width="294.0" height="28" rx="7" fill="#e1f4e9" stroke="#2d8a5f" stroke-width="1.5"/><text x="190.0" y="695" fill="#0d4d33" font-size="12.5" text-anchor="middle">Breaker closed. Resume consumption.</text><line x1="20" y1="730" x2="700" y2="730" stroke="#111827" stroke-dasharray="3 5" stroke-opacity=".7"/><rect x="24" y="721" width="245.0" height="18" rx="4" fill="#ffe9a3" stroke="#111827"/><text x="31.0" y="734" fill="#5c4300" font-size="12.5" font-weight="700">A different record: permanent error</text><line x1="109.0" y1="778" x2="611.0" y2="778" stroke="#111827" stro