<svg viewBox="0 0 920 470" role="img" aria-label="Kafka architecture: producers, brokers with partitions, consumer groups">
<rect width="920" height="470" fill="#ffffff"/>
<g font-size="13.5" fill="#e8eeff">
<rect x="20" y="40" width="150" height="46" rx="8" fill="#f0f4fb" stroke="#111827"/><text x="95" y="68" text-anchor="middle" fill="#111827" font-weight="700">Producer A</text>
<rect x="20" y="110" width="150" height="46" rx="8" fill="#f0f4fb" stroke="#111827"/><text x="95" y="138" text-anchor="middle" fill="#111827" font-weight="700">Producer B (CDC)</text>
<rect x="210" y="20" width="450" height="360" rx="14" fill="#f0f4fb" stroke="#b9c4de"/>
<text x="435" y="46" text-anchor="middle" fill="#111827" font-weight="700" font-size="16">Kafka cluster (KRaft controllers + brokers)</text>
<text x="435" y="68" text-anchor="middle" fill="#4b5563">Topic: orders  (3 partitions, replication factor 3)</text>
<rect x="230" y="84" width="130" height="270" rx="10" fill="#e4ebf7" stroke="#b9c4de"/><text x="295" y="106" text-anchor="middle" fill="#111827">Broker 1</text>
<rect x="400" y="84" width="130" height="270" rx="10" fill="#e4ebf7" stroke="#b9c4de"/><text x="465" y="106" text-anchor="middle" fill="#111827">Broker 2</text>
<rect x="540" y="84" width="110" height="270" rx="10" fill="#e4ebf7" stroke="#b9c4de"/><text x="595" y="106" text-anchor="middle" fill="#111827">Broker 3</text>
<rect x="240" y="120" width="110" height="52" rx="6" fill="#111827"/><text x="295" y="142" text-anchor="middle" fill="#ffffff" font-weight="700">P0 leader</text><text x="295" y="160" text-anchor="middle" fill="#ffffff" font-size="11.5">offsets 0..9812</text>
<rect x="240" y="184" width="110" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="295" y="206" text-anchor="middle">P1 follower</text>
<rect x="240" y="248" width="110" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="295" y="270" text-anchor="middle">P2 follower</text>
<rect x="410" y="120" width="110" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="465" y="142" text-anchor="middle">P0 follower</text>
<rect x="410" y="184" width="110" height="52" rx="6" fill="#111827"/><text x="465" y="206" text-anchor="middle" fill="#ffffff" font-weight="700">P1 leader</text>
<rect x="410" y="248" width="110" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="465" y="270" text-anchor="middle">P2 follower</text>
<rect x="545" y="120" width="100" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="595" y="142" text-anchor="middle">P0 follower</text>
<rect x="545" y="184" width="100" height="52" rx="6" fill="#f0f4fb" stroke="#2f6db5"/><text x="595" y="206" text-anchor="middle">P1 follower</text>
<rect x="545" y="248" width="100" height="52" rx="6" fill="#111827"/><text x="595" y="270" text-anchor="middle" fill="#ffffff" font-weight="700">P2 leader</text>
<text x="435" y="340" text-anchor="middle" fill="#4b5563" font-size="12">Writes and reads go to the partition leader; followers replicate</text>
<rect x="710" y="30" width="190" height="150" rx="10" fill="#f0f4fb" stroke="#111827"/><text x="805" y="54" text-anchor="middle" fill="#111827" font-weight="700">Consumer group "billing"</text>
<text x="805" y="82" text-anchor="middle">C1 reads P0</text><text x="805" y="106" text-anchor="middle">C2 reads P1</text><text x="805" y="130" text-anchor="middle">C3 reads P2</text><text x="805" y="160" text-anchor="middle" fill="#4b5563" font-size="12">each partition: one consumer per group</text>
<rect x="710" y="210" width="190" height="110" rx="10" fill="#f0f4fb" stroke="#b9c4de"/><text x="805" y="234" text-anchor="middle" fill="#111827" font-weight="700">Consumer group "search"</text>
<text x="805" y="262" text-anchor="middle">C1 reads P0, P1, P2</text><text x="805" y="288" text-anchor="middle" fill="#4b5563" font-size="12">independent offsets, same data</text>
<line x1="170" y1="63" x2="210" y2="110" stroke="#111827" stroke-width="2"/><line x1="170" y1="133" x2="210" y2="140" stroke="#111827" stroke-width="2"/>
<line x1="660" y1="120" x2="710" y2="100" stroke="#111827" stroke-width="2"/><line x1="660" y1="250" x2="710" y2="260" stroke="#111827" stroke-width="2"/>
<rect x="20" y="400" width="880" height="54" rx="8" fill="#ffffff" stroke="#b9c4de"/>
<text x="460" y="424" text-anchor="middle" fill="#4b5563">A partition is an append-only log: [0][1][2][3][4]...  Each record has an offset. Consumers track their own position.</text>
<text x="460" y="444" text-anchor="middle" fill="#4b5563">Records are retained for a time or size limit, or compacted to the latest value per key. Reading does not delete.</text>
</g></svg>